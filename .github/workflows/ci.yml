name: CI

on:
  push:
  pull_request:

jobs:
  sim-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: sim-server
        run: pip install -e ".[dev]"
      - name: Ruff
        working-directory: sim-server
        run: ruff check simstudio runner tests
      - name: Unit tests, including geometry
        working-directory: sim-server
        run: pytest geometry/tests post/tests tests -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Test
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        env:
          DATABASE_URL: postgresql://radlab:radlab@localhost:5432/radlab
          JWT_SECRET: ci-secret-ci-secret-ci-secret
        run: npm run build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate
