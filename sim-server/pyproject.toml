[project]
name = "simstudio-sim-server"
version = "0.1.0"
description = "gRPC sim server for OpenRadioss / OpenCourant explicit runs"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.66",
  "grpcio-tools>=1.66",
  "protobuf>=5",
  "boto3>=1.35",
  "redis>=5",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "numpy>=2",
  "pillow>=10",
  "scipy>=1.13",
  "pandas>=2.2",
  "pyvista>=0.44",
  "vtk>=9.3",
  "matplotlib>=3.8",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "fakeredis>=2.26"]
post = ["pandas>=2.2", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["geometry*", "runner*", "post*", "simstudio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["simstudio/gen"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E731"]
