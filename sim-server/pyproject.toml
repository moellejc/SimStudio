[project]
name = "simstudio-sim-server"
version = "0.1.0"
description = "gRPC sim server for OpenRadioss / OpenCourant explicit runs"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.66",
  "grpcio-tools>=1.66",
  "protobuf>=5",
  "boto3>=1.35",
  "redis>=5",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "fakeredis>=2.26"]
post = ["pandas>=2.2", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["geometry*", "runner*", "post*", "simstudio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
